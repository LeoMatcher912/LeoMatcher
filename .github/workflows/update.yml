name: Aggiorna Quote Matcher Pro

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa OddsHarvester e Chromium
        run: |
          pip install --upgrade pip
          pip install oddsharvester
          playwright install --with-deps chromium

      - name: Scarica quote campionati principali
        run: |
          oddsharvester upcoming -s football \
            -l italy-serie-a,italy-serie-b,england-premier-league,spain-laliga,germany-bundesliga,france-ligue-1 \
            -m 1x2 \
            --kickoff-within-hours 72 \
            --base-url https://www.centroquote.it \
            --locale it-IT \
            --timezone Europe/Rome \
            -f json \
            -o raw_main.json \
            --headless || echo "⚠️ Scraping campionati principali terminato con errore o nessuna partita"

      - name: Scarica quote coppe europee
        run: |
          oddsharvester upcoming -s football \
            -l europe-champions-league,europe-europa-league \
            -m 1x2 \
            --kickoff-within-hours 72 \
            --base-url https://www.centroquote.it \
            --locale it-IT \
            --timezone Europe/Rome \
            -f json \
            -o raw_cups.json \
            --headless || echo "⚠️ Scraping coppe europee terminato con errore o nessuna partita"

      - name: Genera quote.json per Matcher Pro
        run: |
          python build_feed.py
          rm -f raw_main.json raw_cups.json

      - name: Salva quote.json nel repository
        run: |
          git config user.name "MatcherPro Bot"
          git config user.email "bot@users.noreply.github.com"
          git add quote.json
          if ! git diff --staged --quiet; then
            git commit -m "Aggiornamento automatico quote"
            git push
          else
            echo "Nessuna modifica a quote.json"
          fi
